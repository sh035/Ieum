apiVersion: v1
kind: Service
metadata:
  name: account
  namespace: ieum
spec:
  selector:
    app: account
  ports:
    - name: http
      port: 8081
    - name: grpc
      port: 9081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: ieum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: account
          image: 192.168.219.102:30003/ieum/account:0.0.1
          envFrom:
            - configMapRef:
                name: ieum-common
            - secretRef:
                name: ieum-common
            - secretRef:
                name: account-jwt
          env:
            - { name: JWT_ACCESS_TOKEN_TTL, value: PT30M }
            - { name: JWT_REFRESH_TOKEN_TTL, value: P14D }
          ports:
            - containerPort: 8081
            - containerPort: 9081
          # /actuator/health 는 인증이 걸려 있어서 포트 열림으로 판단
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
