syntax = "proto3";

package ieum.grocery.v1;

option java_multiple_files = true;
option java_package = "com.ieum.proto.grocery.v1";

// 서비스 간 호출 전용. Gateway 에 노출하지 않는다.
service GroceryInternalService {
  // 그날 브리핑에 들어갈 계정별 유통기한 임박 재고 개수. 0 인 계정은 담지 않는다.
  rpc GetBriefingCounts(GetBriefingCountsRequest) returns (GetBriefingCountsResponse);
}

message GetBriefingCountsRequest {
  // yyyy-MM-dd
  string date = 1;
}

message GetBriefingCountsResponse {
  // key 는 account_id
  map<string, int32> expiring = 1;
}
