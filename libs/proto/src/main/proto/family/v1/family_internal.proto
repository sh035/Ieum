syntax = "proto3";

package ieum.family.v1;

option java_multiple_files = true;
option java_package = "com.ieum.proto.family.v1";

// 서비스 간 호출 전용. Gateway 에 노출하지 않는다.
service FamilyInternalService {
  // 구성원이 아니면 NOT_FOUND 로 응답한다.
  rpc GetMemberRole(GetMemberRoleRequest) returns (GetMemberRoleResponse);

  // 여러 계정을 한 번에 확인한다. 구성원인 계정만 담아 응답한다.
  rpc GetMemberRoles(GetMemberRolesRequest) returns (GetMemberRolesResponse);

  // 가족 이름과 현재 구성원. 없거나 삭제된 가족이면 NOT_FOUND 로 응답한다.
  rpc GetFamily(GetFamilyRequest) returns (GetFamilyResponse);

  // 계정이 지금 속한 가족들. 없으면 빈 목록으로 응답한다.
  rpc GetFamilyIds(GetFamilyIdsRequest) returns (GetFamilyIdsResponse);

  // 그 가족에서 쓰는 닉네임. 나간 구성원도 마지막 닉네임으로 담고, 구성원이었던 적 없는 계정은 빠진다.
  rpc GetMemberNicknames(GetMemberNicknamesRequest) returns (GetMemberNicknamesResponse);

  // 탈퇴 전에 확인한다. 소유권을 넘겨야 하는 가족이 있으면 탈퇴할 수 없다.
  rpc CheckWithdrawal(CheckWithdrawalRequest) returns (WithdrawalCheck);

  // 탈퇴하는 계정을 모든 가족에서 내보낸다. 소유권을 넘겨야 하는 가족이 있거나,
  // 혼자인 가족이 있는데 delete_solo_families 가 false 면 아무것도 바꾸지 않고 left = false 로 응답한다.
  rpc LeaveAllFamilies(LeaveAllFamiliesRequest) returns (LeaveAllFamiliesResponse);
}

message GetMemberRoleRequest {
  string family_id = 1;
  string account_id = 2;
}

message GetMemberRoleResponse {
  FamilyRole role = 1;
}

message GetMemberRolesRequest {
  string family_id = 1;
  repeated string account_ids = 2;
}

message GetMemberRolesResponse {
  // key 는 account_id
  map<string, FamilyRole> roles = 1;
}

message GetFamilyRequest {
  string family_id = 1;
}

message GetFamilyResponse {
  string name = 1;
  repeated FamilyMember members = 2;
}

message GetFamilyIdsRequest {
  string account_id = 1;
}

message GetFamilyIdsResponse {
  repeated string family_ids = 1;
}

message GetMemberNicknamesRequest {
  string family_id = 1;
  repeated string account_ids = 2;
}

message GetMemberNicknamesResponse {
  // key 는 account_id
  map<string, string> nicknames = 1;
}

message CheckWithdrawalRequest {
  string account_id = 1;
}

message WithdrawalCheck {
  // 다른 구성원이 있는데 OWNER 인 가족
  repeated FamilySummary transfer_required_families = 1;
  // 혼자인 가족. 탈퇴하면 삭제된다.
  repeated FamilySummary solo_families = 2;
}

message FamilySummary {
  string family_id = 1;
  string name = 2;
}

message LeaveAllFamiliesRequest {
  string account_id = 1;
  bool delete_solo_families = 2;
}

message LeaveAllFamiliesResponse {
  bool left = 1;
  WithdrawalCheck check = 2;
}

message FamilyMember {
  string account_id = 1;
  FamilyRole role = 2;
}

enum FamilyRole {
  FAMILY_ROLE_UNSPECIFIED = 0;
  FAMILY_ROLE_OWNER = 1;
  FAMILY_ROLE_MANAGER = 2;
  FAMILY_ROLE_MEMBER = 3;
}
