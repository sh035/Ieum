spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: account
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: account
  grpc:
    client:
      channel:
        family:
          target: ${FAMILY_GRPC_TARGET}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        # Kafka 장애가 API 지연으로 번지지 않게 발행 대기를 2초로 끊는다.
        max.block.ms: 2000

server:
  port: 8081

# 서비스 간 호출을 받는 gRPC 포트. REST 포트와 짝을 맞춘다.
spring.grpc.server.port: 9081

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL}
