spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: planner
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: planner
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: planner
      auto-offset-reset: earliest
    producer:
      properties:
        # Kafka 장애가 API 지연으로 번지지 않게 발행 대기를 2초로 끊는다.
        max.block.ms: 2000
  grpc:
    client:
      channel:
        family:
          target: ${FAMILY_GRPC_TARGET}

server:
  port: 8083

spring.grpc.server.port: 9083

planner:
  scheduler:
    due-soon-cron: "0 * * * * *"

jwt:
  public-key: ${JWT_PUBLIC_KEY}
