spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: notification
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification
      auto-offset-reset: earliest
    producer:
      properties:
        # Kafka 장애 시 리스너가 오래 막히지 않게 발행 대기를 2초로 끊는다.
        max.block.ms: 2000
  grpc:
    client:
      channel:
        account:
          target: ${ACCOUNT_GRPC_TARGET}
        family:
          target: ${FAMILY_GRPC_TARGET}

server:
  port: 8086

jwt:
  public-key: ${JWT_PUBLIC_KEY}

notification:
  delivery:
    auto-offset-reset: latest

firebase:
  credentials: ${FIREBASE_CREDENTIALS:}
