spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: notification
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification
      auto-offset-reset: earliest
    producer:
      properties:
        # Kafka 장애 시 리스너가 오래 막히지 않게 발행 대기를 2초로 끊는다.
        max.block.ms: 2000
  task:
    scheduling:
      pool:
        # 브리핑 발송이 길어져도 SSE heartbeat 가 밀리지 않게 스레드를 하나 더 둔다.
        size: 2
  grpc:
    client:
      channel:
        account:
          target: ${ACCOUNT_GRPC_TARGET}
        family:
          target: ${FAMILY_GRPC_TARGET}
        planner:
          target: ${PLANNER_GRPC_TARGET}
        grocery:
          target: ${GROCERY_GRPC_TARGET}

server:
  port: 8086

jwt:
  public-key: ${JWT_PUBLIC_KEY}

notification:
  delivery:
    auto-offset-reset: latest
  scheduler:
    # 09:00 에 조회가 실패한 날을 위해 09:30 에 한 번 더 돈다. 이미 받은 사람은 dedup 키로 건너뛴다.
    briefing-cron: "0 0,30 9 * * *"

firebase:
  credentials: ${FIREBASE_CREDENTIALS:}
