spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: expense
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: expense
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        # Kafka 장애가 API 지연으로 번지지 않게 발행 대기를 2초로 끊는다.
        max.block.ms: 2000
  grpc:
    client:
      channel:
        family:
          target: ${FAMILY_GRPC_TARGET}

server:
  port: 8085

jwt:
  public-key: ${JWT_PUBLIC_KEY}
