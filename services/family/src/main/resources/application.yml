spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: family
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: family
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        # Kafka 장애가 API 지연으로 번지지 않게 발행 대기를 2초로 끊는다.
        max.block.ms: 2000

server:
  port: 8082

# 서비스 간 호출을 받는 gRPC 포트. REST 포트와 짝을 맞춘다.
spring.grpc.server.port: 9082

jwt:
  public-key: ${JWT_PUBLIC_KEY}
