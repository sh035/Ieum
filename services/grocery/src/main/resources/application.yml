spring:
  config:
    import: "optional:file:./.${SPRING_PROFILES_ACTIVE}.env[.properties]"
  application:
    name: grocery
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: grocery
  grpc:
    client:
      channel:
        family:
          target: ${FAMILY_GRPC_TARGET}

server:
  port: 8084

jwt:
  public-key: ${JWT_PUBLIC_KEY}
